version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      aws:
        patterns: ["github.com/aws/*"]
    ignore:
      # The AWS SDK publishes patch releases almost daily: minor bumps are enough.
      - dependency-name: "*"
        update-types: [version-update:semver-patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - # docker-buildx-ecr: both the Docker CLI base image and our own binary image
    package-ecosystem: docker
    directory: /docker-buildx-ecr
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude: ["ghcr.io/chialab/aws-ecr-get-login-password"] # our own releases, no reason to wait

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
