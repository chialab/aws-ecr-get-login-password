version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      aws:
        patterns: ["github.com/aws/*"]
    ignore:
      # The AWS SDK publishes patch releases almost daily: minor bumps are enough.
      - dependency-name: "*"
        update-types: [version-update:semver-patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
